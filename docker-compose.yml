services:
  personal-website:
    image: personal-website
    container_name: personal-website
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./spotify-data.json:/app/spotify-data.json
      - ./speed-data.json:/app/speed-data.json
      - ./location-data.json:/app/location-data.json
    dns:
      - 8.8.8.8
      - 1.1.1.1
