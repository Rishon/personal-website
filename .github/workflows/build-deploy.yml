name: Build and Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        env:
          PORT: ${{ secrets.PORT }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_DISCORD_ID: ${{ secrets.NEXT_PUBLIC_DISCORD_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_SPOTIFY_CLIENT_ID }}
          NEXT_PUBLIC_SPOTIFY_OAUTH: ${{ secrets.NEXT_PUBLIC_SPOTIFY_OAUTH }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: PORT,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_DISCORD_ID,NEXT_PUBLIC_TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,NEXT_PUBLIC_SPOTIFY_CLIENT_ID,NEXT_PUBLIC_SPOTIFY_OAUTH,SPOTIFY_CLIENT_SECRET,NEXT_PUBLIC_GA_ID,NEXT_PUBLIC_CLARITY_ID,MAIL_HOST,MAIL_PORT,MAIL_SECURE,MAIL_USERNAME,MAIL_PASSWORD,MAIL_TO,COMMIT_SHA
          script: |
            set -e

            mkdir -p /opt/github
            cd /opt/github

            if [ ! -d "personal-website" ]; then
              git clone https://github.com/Rishon/personal-website.git
            fi

            cd personal-website
            git fetch origin master
            git reset --hard origin/master

            rm -f .env .env.production
            {
              echo "PORT=${PORT}"
              echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
              echo "NEXT_PUBLIC_DISCORD_ID=${NEXT_PUBLIC_DISCORD_ID}"
              echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
              echo "TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}"
              echo "NEXT_PUBLIC_SPOTIFY_CLIENT_ID=${NEXT_PUBLIC_SPOTIFY_CLIENT_ID}"
              echo "NEXT_PUBLIC_SPOTIFY_OAUTH=${NEXT_PUBLIC_SPOTIFY_OAUTH}"
              echo "SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}"
              echo "NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}"
              echo "NEXT_PUBLIC_CLARITY_ID=${NEXT_PUBLIC_CLARITY_ID}"
              echo "MAIL_HOST=${MAIL_HOST}"
              echo "MAIL_PORT=${MAIL_PORT}"
              echo "MAIL_SECURE=${MAIL_SECURE}"
              echo "MAIL_USERNAME=${MAIL_USERNAME}"
              echo "MAIL_PASSWORD=${MAIL_PASSWORD}"
              echo "MAIL_TO=${MAIL_TO}"
            } > .env
            chmod 600 .env

            [ -f spotify-data.json ] || echo '{}' > spotify-data.json

            docker build . -t personal-website \
              --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
              --build-arg NEXT_PUBLIC_DISCORD_ID="${NEXT_PUBLIC_DISCORD_ID}" \
              --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${NEXT_PUBLIC_TURNSTILE_SITE_KEY}" \
              --build-arg NEXT_PUBLIC_SPOTIFY_CLIENT_ID="${NEXT_PUBLIC_SPOTIFY_CLIENT_ID}" \
              --build-arg NEXT_PUBLIC_SPOTIFY_OAUTH="${NEXT_PUBLIC_SPOTIFY_OAUTH}" \
              --build-arg NEXT_PUBLIC_GA_ID="${NEXT_PUBLIC_GA_ID}" \
              --build-arg NEXT_PUBLIC_CLARITY_ID="${NEXT_PUBLIC_CLARITY_ID}" \
              --build-arg NEXT_PUBLIC_BUILD_ID="$(echo "${COMMIT_SHA}" | cut -c1-7)"

            docker compose up -d --force-recreate --remove-orphans
            docker image prune --force
